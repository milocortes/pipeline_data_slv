apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  selector:
    matchLabels: { app: airflow, tier: rustfs }
  template:
    metadata:
      labels: { app: airflow, tier: rustfs }
    spec:
      containers:
        - name: rustfs-storage
          image: rustfs/rustfs:latest
          ports:
            - containerPort: 9000
              protocol: TCP
            - containerPort: 9001
              protocol: TCP
          envFrom:
            - configMapRef: { name: config }
            - secretRef: { name: secrets }
          args:
            - --address
            - :9000
            - --console-enable
            - --server-domains
            - example.com
            - --access-key
            - rustfsadmin
            - --secret-key
            - rustfsadmin
            - /data
          volumeMounts:
            - name: rustfs-storage
              #mountPath: /mnt/rustfs/data:/data
              mountPath: /data
      volumes:
        - name: rustfs-storage
          persistentVolumeClaim:
            claimName: data-volume
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  type: NodePort
  selector: { app: airflow, tier: rustfs }
  ports:
    - name: "9000"
      port: 9000
      targetPort: 9000
    - name: "9001"
      port: 9001
      targetPort: 9001