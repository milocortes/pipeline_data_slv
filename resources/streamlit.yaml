apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
spec:
  replicas: 2
  selector:
    matchLabels: { app: airflow, tier: streamlit }
  template:
    metadata:
      labels: { app: airflow, tier: streamlit }
    spec:
      containers:
        - name: streamlit
          image: streamlit_app:1.0.0
          ports:
            - containerPort: 8502
          envFrom:
            - configMapRef: { name: config }
            - secretRef: { name: secrets }

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit
spec:
  type: NodePort
  selector: { app: airflow, tier: streamlit }
  ports:
    - port: 8502
      targetPort: 8502